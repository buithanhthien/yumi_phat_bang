# Yumi hardware odometry. The frame normalizer publishes /odom/stm32.
ekf_filter_node:
  ros__parameters:

    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    use_sim_time: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom/stm32

    # Fuse: x, y, yaw, vx, vyaw (không fuse vy)
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]

    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
